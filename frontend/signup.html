<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CampusConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="auth-container">

        <div class="auth-box">

            <h1><i>Join CampusConnect 🎓</i></h1>
            <p>Create an account to join our vibrant student community!</p>

            <form id="signupForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </section>

    <script src="js/script.js"></script>

</body>
</html>
